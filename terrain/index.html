<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Spectral Relief</title>
    <script type="module" crossorigin src="./assets/index-AqUvfRaw.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-CE62NYHe.css">
  </head>
  <body>
    <div id="stage">
      <canvas id="view"></canvas>
      <div id="grain"></div>
    </div>

    <header id="topbar">
      <div class="brand">SPECTRAL&nbsp;RELIEF</div>
      <button id="btn-open" class="chip">Open audio / image</button>
      <div id="srcname">no source</div>
      <div class="grow"></div>
      <button id="btn-reset" class="chip ghost" title="Restore default settings">Reset settings</button>
      <button id="btn-present" class="chip" title="Show only the spectrogram (P)">Present</button>
    </header>

    <div id="empty">
      <div class="big">Drop an audio file or an image</div>
      <div class="sub">or <button id="empty-open" class="link">open one</button></div>
    </div>

    <div id="hint">drag to orbit · right-drag to pan · scroll to zoom · space play / pause · P present</div>

    <footer id="transport">
      <button id="play" title="Play / pause (space)">
        <svg viewBox="0 0 24 24" class="i-play"><path d="M8 5v14l11-7z" /></svg>
        <svg viewBox="0 0 24 24" class="i-pause"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z" /></svg>
      </button>
      <span id="tcur" class="t">0:00</span>
      <input id="seek" type="range" min="0" max="1000" value="0" step="1" />
      <span id="tdur" class="t">0:00</span>
      <select id="pmode" title="Playhead style">
        <option value="cursor">Cursor</option>
        <option value="reveal">Reveal</option>
        <option value="off">Off</option>
      </select>
    </footer>

    <div id="panel"></div>

    <div id="notice" hidden><span class="txt"></span><button type="button"></button></div>
    <div id="present-hint" hidden>Esc to exit · Space to play / pause</div>

    <div id="loading" hidden>
      <div class="lbl">Working…</div>
      <div class="bar"><i></i></div>
    </div>

    <div id="drop" hidden><span>Drop audio or image</span></div>
    <div id="toast" hidden></div>

    <input id="file" type="file" accept="audio/*,image/*,video/*" hidden />
  </body>
</html>
