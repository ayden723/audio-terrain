<!doctype html>
<html lang="en" data-look="Ember" data-ink="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ripples - Sound Labs</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230b0b0d'/%3E%3Crect x='3' y='6' width='2' height='4' fill='%23fff'/%3E%3Crect x='7' y='3' width='2' height='10' fill='%23fff'/%3E%3Crect x='11' y='5' width='2' height='6' fill='%23fff'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/src/ripples/style.css" />

    <script src="/wipe-in.js"></script>
  </head>
  <body>
    <div id="stage"><canvas id="view"></canvas></div>

    <header id="topbar">
      <a class="brand" href="/" title="Back to Sound Labs">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
        <span class="brand-txt">RIPPLES</span>
      </a>
      <span class="tag">test</span>
      <button id="btn-rain" class="chip ghost on" aria-pressed="true">Rain</button>
      <button id="btn-sound" class="chip ghost" aria-pressed="false">Sound off</button>
      <div id="status">tap the water to play</div>
    </header>

    <div id="hint">tap or drag across the water · drag outside the pool or right-drag to turn it · space drops a stone</div>

    <div id="panel"></div>
    <script type="module" src="/src/ripples/main.js"></script>
  </body>
</html>
