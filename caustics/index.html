<!doctype html>
<html lang="en" data-look="Reference">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Caustics - Sound Labs</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230b0b0d'/%3E%3Crect x='3' y='6' width='2' height='4' fill='%23fff'/%3E%3Crect x='7' y='3' width='2' height='10' fill='%23fff'/%3E%3Crect x='11' y='5' width='2' height='6' fill='%23fff'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/src/caustics/style.css" />
    <!-- Covers the page before first paint when arriving through the scanline wipe. -->
    <script src="/wipe-in.js"></script>
  </head>
  <body>
    <div id="stage"><canvas id="view"></canvas></div>

    <header id="topbar">
      <a class="brand" href="/" title="Back to Sound Labs">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
        <span class="brand-txt">CAUSTICS</span>
      </a>
      <span class="tag">test</span>
      <button id="btn-open" class="chip">Open audio</button>
      <button id="btn-mic" class="chip ghost">Microphone</button>
      <button id="btn-play" class="chip ghost" hidden>Pause</button>
      <div id="srcname">idle preview · drop an audio file</div>
    </header>

    <div id="hint">drag to orbit · scroll to zoom · space play / pause</div>

    <div id="panel"></div>
    <div id="drop" hidden><span>Drop audio</span></div>
    <div id="toast" hidden></div>
    <input id="file" type="file" accept="audio/*,video/*" hidden />
    <script type="module" src="/src/caustics/main.js"></script>
  </body>
</html>
